# fleet-waiver: freshness -- 純 Python 標準庫專案，沒有第三方套件宣告（無 requirements／pyproject 依賴）可以拿來比對下限；Actions 版本由下方 github-actions 的 Dependabot 追蹤
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    groups:
      github-actions:
        patterns: ["*"]
